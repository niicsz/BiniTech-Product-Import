spring:
  application:
    name: BiniTech Product Import
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${PRODUCT_IMPORT_MONGODB_URI}
      database: ${PRODUCT_IMPORT_MONGODB_DATABASE:binitech_product_import}
      auto-index-creation: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMPORT_MAX_FILE_SIZE:20MB}
      max-request-size: ${PRODUCT_IMPORT_MAX_FILE_SIZE:20MB}

server:
  port: ${PORT:8082}

auth:
  service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  connect-timeout: ${AUTH_CONNECT_TIMEOUT:2s}
  read-timeout: ${AUTH_READ_TIMEOUT:5s}

pdv:
  service-url: ${PDV_SERVICE_URL:http://localhost:8080}
  service-key: ${PRODUCT_IMPORT_SERVICE_KEY}
  connect-timeout: ${PDV_CONNECT_TIMEOUT:3s}
  read-timeout: ${PDV_READ_TIMEOUT:20s}

imports:
  max-file-bytes: ${PRODUCT_IMPORT_MAX_FILE_BYTES:20971520}
  max-records: ${PRODUCT_IMPORT_MAX_RECORDS:50000}
  batch-size: ${PRODUCT_IMPORT_BATCH_SIZE:250}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
